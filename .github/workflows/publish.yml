name: Publish NuGet Package to GitHub Packages

on:
  push:
    branches: ["master"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GH_TOKEN }};ValidAuthenticationTypes=Basic
        run: dotnet restore AlfaHackaton.HttpClient.slnx --configfile NuGet.config
      - name: Test
        run: dotnet test AlfaHackaton.HttpClient.slnx --configuration Release --no-restore
      - name: Pack
        run: dotnet pack AlfaHackaton.HttpClient.csproj --configuration Release --no-build --output ./artifacts/nupkg
      - name: Publish to GitHub Packages
        run: >-
          dotnet nuget push ./artifacts/nupkg/*.nupkg
          --api-key "${{ secrets.GH_TOKEN }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate
